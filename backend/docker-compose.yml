services:

  # =========================
  # DATABASE
  # =========================

  mongodb:
    image: mongo:8
    container_name: nexacart-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db


  # =========================
  # CACHE
  # =========================

  redis:
    image: redis:7-alpine
    container_name: nexacart-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data


  # =========================
  # API GATEWAY
  # =========================

  gateway:
    build:
      context: ./gateway
    container_name: nexacart-gateway
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./gateway/.env
    environment:
      # Override host-based URLs with docker DNS names
      AUTH_SERVICE: http://auth-service:5001
      PRODUCT_SERVICE: http://product-service:5003
      CART_SERVICE: http://cart-service:5004
      ORDER_SERVICE: http://order-service:5005
      PAYMENT_SERVICE: http://payment-service:5006
      INVENTORY_SERVICE: http://inventory-service:5007
      NOTIFICATION_SERVICE: http://notification-service:5008
      AGENT_SERVICE: http://agent-service:5009
    depends_on:
      - auth-service
      - product-service
      - cart-service
      - order-service
      - payment-service
      - inventory-service
      - notification-service
      - agent-service


  # =========================
  # AUTH SERVICE
  # =========================

  auth-service:
    build:
      context: ./services/auth
    container_name: nexacart-auth
    restart: unless-stopped
    ports:
      - "5001:5001"
    env_file:
      - ./services/auth/.env
    depends_on:
      - mongodb


  # =========================
  # PRODUCT SERVICE
  # =========================

  product-service:
    build:
      context: ./services/product
    container_name: nexacart-product
    restart: unless-stopped
    ports:
      - "5003:5003"
    env_file:
      - ./services/product/.env
    environment:
      AGENT_SERVICE_URL: http://agent-service:5009
    depends_on:
      - mongodb


  # =========================
  # CART SERVICE
  # =========================

  cart-service:
    build:
      context: ./services/cart
    container_name: nexacart-cart
    restart: unless-stopped
    ports:
      - "5004:5004"
    env_file:
      - ./services/cart/.env
    environment:
      PRODUCT_SERVICE_URL: http://product-service:5003
    depends_on:
      - mongodb
      - product-service


  # =========================
  # ORDER SERVICE
  # =========================

  order-service:
    build:
      context: ./services/order
    container_name: nexacart-order
    restart: unless-stopped
    ports:
      - "5005:5005"
    env_file:
      - ./services/order/.env
    environment:
      INVENTORY_SERVICE_URL: http://inventory-service:5007
      NOTIFICATION_SERVICE_URL: http://notification-service:5008
    depends_on:
      - mongodb
      - cart-service
      - inventory-service
      - payment-service


  # =========================
  # PAYMENT SERVICE
  # =========================

  payment-service:
    build:
      context: ./services/payment
    container_name: nexacart-payment
    restart: unless-stopped
    ports:
      - "5006:5006"
    env_file:
      - ./services/payment/.env
    environment:
      ORDER_SERVICE_URL: http://order-service:5005
    depends_on:
      - mongodb
      - order-service


  # =========================
  # INVENTORY SERVICE
  # =========================

  inventory-service:
    build:
      context: ./services/inventory
    container_name: nexacart-inventory
    restart: unless-stopped
    ports:
      - "5007:5007"
    env_file:
      - ./services/inventory/.env
    depends_on:
      - mongodb


  # =========================
  # NOTIFICATION SERVICE
  # =========================

  notification-service:
    build:
      context: ./services/notification
    container_name: nexacart-notification
    restart: unless-stopped
    ports:
      - "5008:5008"
    env_file:
      - ./services/notification/.env
    depends_on:
      - mongodb


  # =========================
  # AGENT SERVICE (NexaGuard)
  # =========================

  agent-service:
    build:
      context: ./services/agent
    container_name: nexacart-agent
    restart: unless-stopped
    ports:
      - "5009:5009"
    environment:
      PORT: 5009
      MONGO_URI: mongodb://mongodb:27017/nexa_agent
      PRODUCT_SERVICE_URL: http://product-service:5003
      INVENTORY_SERVICE_URL: http://inventory-service:5007
    depends_on:
      - mongodb
      - product-service
      - inventory-service


# =========================
# VOLUMES
# =========================

volumes:
  mongodb_data:
  redis_data:
